# wandb
use_wandb: False
wandb_project_name: AFA
wandb_mode: online # online / offline / disabled

n_epochs: 50
task: 'AS_EF' # 'AS', 'EF', 'AS_EF'
device: 'cpu' # 'cuda' or 'cpu'
log_profile: False

agent:
  agent_name: 'Echo-Prime-PPO'  
  agent_checkpoint: # '/path_to_video_selector_agent_checkpoint/', or leave empty to start a new agent.
  lr: 0.001
  discount_factor: 1.0

  # DDQN
  eps_start: 1.0
  eps_final: 0.01
  eps_decay: 10000
  TAU: 1.0  #  how much to change the Q-network or Q-Table
  target_update_freq: 10000  # number of steps
  memory_size: 50000  number of steps
  memory_bs: 128

  # PPO & GRPO
  update_freq: 1024 # number of steps
  update_n_epochs: 10
  group_size: 4  # number of policies in a group (GRPO only)

  # scheduler for RL
  milestones: [ 15, 30, 50 ]
  gamma: 0.1

environment:
  env_name: 'Echo-Prime' 
  env_render: False 
  lammy: 0.1  # weight of cost -> env.get_reward function
  max_step: 6  # adjust according to your setup
  n_actions: 6  # adjust according to your setup
  reward_scheme: 'sparse' # 'dense' or 'sparse'

classifier:
  classifier_name: 'echo_prime_former'

  as_head: 'conf_multi_former' # 'sim_former', 'multi_former', 'conf_multi_former'
  ef_head: 'conf_multi_former' # 'sim_former', 'multi_former', 'conf_multi_former'

  as_classifier_path: # '/path_to_as_classifier_checkpoint/'
  ef_regressor_path: # '/path_to_ef_regressor_checkpoint/'

  prob_func: 'PDF' # 'CDF' or 'PDF'
  dist: 'gaussian' # 'laplace' or 'gaussian'
  sigma_floor: 0.125 # 0.05 for train, 0.125 for inference

data:
  dataset_name: 'Echo-Prime'
  dataset_path: # '/path_to_data/'